name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build static GitHub Pages artifact
        run: bun run build:github-pages

      - name: Validate static artifact
        run: |
          test -f dist/client/index.html
          test -f dist/client/experience/index.html
          test -f dist/client/for-contractors/index.html
          test -f dist/client/for-law-firms/index.html
          test -f dist/client/rates/index.html
          test -f dist/client/articles/index.html
          test -f dist/client/contact/index.html
          test -d dist/client/assets
          test -f dist/client/.nojekyll
          ! grep -R '="/assets/' dist/client
          ! grep -R '="/__l5e/' dist/client

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
